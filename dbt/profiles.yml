# Run dbt from the repo root: uv run dbt build --project-dir dbt --profiles-dir dbt
# No secrets live here. The dev target is a local DuckDB file. The snowflake target reads its
# settings from SNOWFLAKE_* environment variables and logs in with a key pair.
kiloplan:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('KILOPLAN_WAREHOUSE_PATH', 'data/warehouse.duckdb') }}"
      threads: 4
    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'unset') }}"
      user: "{{ env_var('SNOWFLAKE_USER', 'unset') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH', 'unset') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'KILOPLAN_PIPELINE') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'KILOPLAN_WH') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'KILOPLAN') }}"
      schema: ANALYTICS
      threads: 4
