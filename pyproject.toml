[project]
name = "kiloplan"
version = "0.1.0"
description = "Powerlifting app: gym calculators, a food diary, and an assistant for your own training program."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "boto3>=1.43.115",
    "duckdb>=1.5.6",
    "fastapi>=0.143.0",
    "ollama>=0.6.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "dbt-core>=1.12.5",
    "dbt-duckdb>=1.11.0",
    "httpx>=0.28.1",
    "moto[s3]>=5.2.4",
    "pytest",
    "ruff",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "tests/helpers"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# shared builders and fixtures' helpers, importable from every test folder
pythonpath = ["tests/helpers"]
addopts = "-ra --strict-markers"
